server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Server-sent events. Without buffering off (and chunked encoding off,
        # and a read timeout longer than an answer takes to generate), nginx
        # holds every SSE frame until its buffer fills and the streaming answer
        # in Sprint 6 hangs with no error anywhere. Do not remove.
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /health {
        proxy_pass         http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }
}
