services:
  db:
    image: pgvector/pgvector:pg18-trixie
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql

  neo4j:
    image: neo4j:5-community-trixie
    container_name: neo4j
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/very_safe_password

  vllm:
      image: vllm/vllm-openai:latest
      restart: unless-stopped
      ipc: host
      ports:
        - "8080:8080"
      volumes:
        - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      environment:
        - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
        - HF_TOKEN=${HF_TOKEN}
        - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
      command:
        - --model
        - Qwen/Qwen3-8B-AWQ
        - --quantization
        - awq_marlin
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --max-model-len
        - "16384"
        - --gpu-memory-utilization
        - "0.75"
        - --max-num-seqs
        - "16"
        - --dtype
        - auto
        - --kv-cache-dtype
        - fp8_e4m3
        - --enable-prefix-caching
        - --enforce-eager
        - --enable-auto-tool-choice
        - --tool-call-parser
        - hermes

volumes:
  postgres_data:
  neo4j_data:
