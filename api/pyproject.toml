[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "docling[tesserocr]>=2.123.1",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "neo4j>=6.3.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "sqlmodel>=0.0.39",
    "transformers>=5.8.1",
    "watchdog>=6.0.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# Exploratory scratch, not shipped code.
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated once and are immutable by design.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.format]
# `ruff format .` would otherwise restyle applied migrations, which hides what
# actually changed. The lint ignores below say the same thing for `ruff check`.
exclude = ["db/migrations/versions/*.py"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these and they are applied history — restyling one hides what
# actually changed, so they are not style-checked at all.
# F401: the alembic template always imports sa/sqlmodel for generated types.
"db/migrations/versions/*.py" = ["E501", "F401", "I001", "UP006", "UP007", "UP035"]
"db/migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
# Tests run against real backing services (Postgres, and for graph tests, the
# live Neo4j); the interesting failures are constraint, transaction and
# connectivity failures, not mock mismatches.
asyncio_mode = "auto"
# One event loop for the whole session: the Neo4j driver and the SQLAlchemy
# engine are process singletons, and a per-test loop rebinds their pools,
# leaving asyncpg connections bound to a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Alembic and the app share one import root, the repo root, so `api.x` resolves
# the same way in a test as in a migration.
pythonpath = [".."]
markers = [
    "models: needs the Docling or BGE-M3 model cache on disk",
]
