# Nickname / diminutive table (S3.3 cascade stage 3).
#
# Canonical given name -> known diminutives. High-precision and free compared
# to embedding or LLM stages, so it earns its place early in the cascade.
# Matching is case-insensitive against the *first token* of an honorific-
# stripped name, so "Lizzy Bennet" matches "Elizabeth Bennet" on the shared
# surname carried by the honorific-stripping stage.

Elizabeth: [Lizzy, Eliza, Liz, Beth, Betsy, Bess, Elsie, Eliz]
Catherine: [Cathy, Kitty, Kate, Cate, Cat, Katie, Cathie]
Katherine: [Kathy, Kitty, Kate, Katie, Kat]
