# Gold relations for Wuthering Heights (S8.5), matching relations.schema.json
# and the rigor of pride_and_prejudice/relations.yaml.
#
# Closed world over in-scope pairs, same as Pride and Prejudice, but
# `scope_tiers` includes `minor` here (not just protagonist/major): Isabella
# Linton, Linton Heathcliff, Mr. Earnshaw and Frances are minor-tier by
# roster.yaml's importance ranking yet central to the two-generation family
# tree this book exists in the gold set to exercise. Leaving them out of scope
# would silently exempt exactly the pairs the collision/family-tree case is
# supposed to stress.
#
# Chapter bounding differs from Pride and Prejudice's convention in one
# respect: P&P's core family is alive for the whole book, so its kinship
# relations run [1, 61]. Half of this book's cast dies mid-story. A relation
# whose subject or object dies is bounded to the chapter of that death (the
# fact stops being freshly evidenced there, even though the biological/legal
# fact does not "expire") rather than padded to chapter 34 -- padding it would
# assert the corpus keeps re-evidencing a relation for a character who is no
# longer in the story. `parent_of`/`sibling_of`/`married_to` edges whose
# parties both remain alive and present (e.g. Hindley -> Hareton, Heathcliff's
# guardianship edges) do run to chapter 34.
#
# All chapters and pages below were verified against this exact corpus build
# (pdf_sha256 matches roster.yaml and the live manifest) by paginating
# corpus/downloads/wuthering-heights.txt with scripts/seed_corpus.py's own
# `strip_boilerplate`/`paginate` and locating the cited text directly -- not
# recalled from memory. Chapter-start pages: III=11, IV=20, V=25, VI=27,
# VII=31, VIII=38, IX=44, X=56, XII=75, XIII=83, XVI=102, XVII=105, XIX=123,
# XX=126, XXI=130, XXVII=164, XXVIII=173, XXX=181, XXXII=189, XXXIV=203.
book_key: wuthering-heights
corpus_pdf_sha256: 68f6058e17d7ba0cdf9154d43bd366267bbad7d9c6f10b4f907bf26141e0962a
page_count: 211
labelled_by: be1 (from the public-domain text and this exact corpus build, S8.5)
labelled_at: "2026-09-28T00:00:00+00:00"
source_notes: >
  Relationships read directly from this corpus build (Gutenberg #768) by
  locating the cited scenes and computing their page with the project's own
  pagination function, the same method used for pride_and_prejudice/relations.yaml.
  Kinship predicates outside the frozen ontology (cousin, aunt/nephew --
  Catherine Linton/Hareton Earnshaw are first cousins, Isabella is Catherine
  Linton's aunt) are deliberately absent, exactly as P&P omits cousin/patron.
  In-law edges are asserted only where the marriage that creates them is
  plot-central (Heathcliff/Edgar via Isabella), not derived exhaustively for
  every combinatorially possible in-law pair -- matching P&P's own economy.
scope_tiers: [protagonist, major, minor]
ignored_predicates: [acquaintance_of, neighbour_of, co_occurs_with]
chapter_tolerance: 3
relations:
