  for the character's earliest-appearing alias, not an estimate -- see the
  module docstring above. Complete-cast pass (S4): every capitalised person-name in the story
  pages was checked; unnamed relations, families in the plural (the Webbs, the
  Gouldings, the Harringtons) and old Mr. Darcy / Wickham's father (an alias
  collision with the living men) are deliberately absent.
  Pending re-verification against be1's real pass-1
  output via scripts/label_roster.py once S3.1 merges (plans/sprint-3/HANDOFF.md).
