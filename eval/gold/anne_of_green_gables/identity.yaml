characters:
  - canonical: Anne Shirley
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Anne, Anne Shirley, Cordelia, Carrots]
      "2": [Anne, Anne Shirley, Miss Shirley]
      "3": [Anne, Anne Shirley, Miss Shirley]
    note: >
      "Carrots" is Gilbert's book-1 taunt about her hair; "Cordelia" is the
      fantasy name she asks people to call her early in book 1 -- both are
      real in-text surface forms she is actually called by, not descriptors
      invented for this gold set. "Miss Shirley" is how she is addressed
      once she is a schoolteacher (book 2) and a college student (book 3),
      the same person narrowing her own surface forms as her role changes.
  - canonical: Gilbert Blythe
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Gilbert, Gilbert Blythe]
      "2": [Gilbert, Gilbert Blythe]
      "3": [Gilbert, Gilbert Blythe, Gil]
    note: >
      The Anne<->Gilbert arc runs rivalry (book 1) to friendship (book 2) to
      engagement (book 3, closing chapters) -- the series' headline
      relationship-arc case.
  - canonical: Marilla Cuthbert
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Marilla, Marilla Cuthbert]
      "2": [Marilla]
      "3": [Marilla]
  - canonical: Matthew Cuthbert
    appears_in: [1]
    surface_forms:
      "1": [Matthew, Matthew Cuthbert]
    dies_in_book: 1
    note: >
      Dies at the end of book 1 (heart failure, after the bank-failure
      news). Named in memory in books 2 and 3 but does not appear as a
      living character again -- the primary cross-book blocking case
      (character_death, S5.2): a system that creates a second "Matthew
      Cuthbert" appearance for book 2 or 3 has linked a memory as a live
      appearance, which this gold set scores as a false merge.
  - canonical: Diana Barry
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Diana, Diana Barry]
      "2": [Diana]
      "3": [Diana, Mrs. Fred Wright]
    note: >
      Becomes engaged to Fred Wright in book 3's closing chapters;
      "Mrs. Fred Wright" (anticipatory, used before the wedding) is the same
      person as "Diana", not a new character.
  - canonical: Rachel Lynde
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Mrs. Rachel Lynde, Mrs. Lynde, Rachel Lynde]
      "2": [Mrs. Lynde, Mrs. Rachel Lynde]
      "3": [Mrs. Lynde, Mrs. Rachel Lynde, Rachel]
    note: >
      Widowed partway through book 3 and moves into Green Gables with
      Marilla -- same person, new household, not a new character.
  - canonical: Miss Josephine Barry
    appears_in: [1, 2]
    surface_forms:
      "1": [Miss Barry, Aunt Josephine, Miss Josephine Barry]
      "2": [Aunt Josephine, Miss Barry]
    note: >
      Diana's great-aunt; present in books 1 and 2, absent from book 3 --
      the gap-appearance case (present, present, absent), scored for
      duplicate/false-merge risk the same as a returning character, not
      skipped just because she does not appear in every book.
  - canonical: Ruby Gillis
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Ruby, Ruby Gillis]
      "2": [Ruby]
      "3": [Ruby, Ruby Gillis]
    dies_in_book: 3
    note: Dies of consumption near the end of book 3.
  - canonical: Jane Andrews
    appears_in: [1, 2, 3]
    surface_forms:
      "1": [Jane, Jane Andrews]
