source_notes: >
  Cross-book identity for Anne of Green Gables books 1-3 (Anne of Green
  Gables, Anne of Avonlea, Anne of the Island). Every surface form below is
  what the real text calls that character in that volume, not a normalised
  guess -- checked against the actual novels, not a plot summary. Twelve
  characters: the protagonist pair whose arc spans all three books, three
  more stable-identity characters across all three, one death (Matthew
  Cuthbert, book 1 -- the primary cross-book blocking case), one
  present/present/absent gap-appearance case (Miss Barry), one death near
  the close of the labelled window (Ruby Gillis, book 3), and three
  characters introduced only in book 3 with no earlier-book history (the
  "new person, do not force a link" case).
