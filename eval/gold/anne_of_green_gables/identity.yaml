  - canonical: Priscilla Grant
    appears_in: [3]
    surface_forms:
      "3": [Priscilla, Priscilla Grant]
    note: >
      New in book 3 -- a Redmond College classmate with no book 1/2 history.
      The "new person, do not force a cross-book link" case.
  - canonical: Philippa Gordon
    appears_in: [3]
    surface_forms:
      "3": [Phil, Philippa Gordon, Philippa]
    note: New in book 3, no earlier-book history.
  - canonical: Fred Wright
    appears_in: [3]
    surface_forms:
      "3": [Fred Wright, Fred]
    note: >
      New in book 3; becomes engaged to Diana Barry at the book's close. No
      earlier-book history -- do not confuse with any other "Fred" (there is
      none in this gold set, but the naming convention is deliberately
      generic enough to test that a system isn't merging on first name
      alone).
