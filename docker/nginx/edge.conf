# S9.4 public-deploy edge: TLS termination, per-IP rate limiting, and an
# edge cache in front of page renders (a CDN stand-in — see HANDOFF.md for
# what actually fronting this with a real CDN would take).
#
# Sits in front of the existing `web` service, which already does the
# SSE-safe /api/ proxy (web/nginx.conf) — this file does not duplicate that,
# it only adds what a public host needs on top: HTTPS, rate limits, caching.
# `make up-prod` boots this overlay LOCALLY, against a self-signed cert, for
# verification only (BRANCH.md: do1 builds the tooling, never executes a
# public deploy).

limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
# nginx's default for both is 503; 429 is the correct HTTP semantic for "you
# are being rate limited" and is what scripts/verify_prod_deploy.py checks for.
limit_req_status 429;
limit_conn_status 429;

proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:10m
    max_size=1g inactive=24h use_temp_path=off;

server {
    listen 8080;
    server_name _;
    # HTTP -> HTTPS. A real deploy terminates the same redirect on :80 behind
    # the host's firewall/DNS; this overlay listens on 8080 so it never
    # collides with a dev stack's own :80/:5174 on the same shared host.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    limit_req  zone=perip burst=20 nodelay;
    limit_conn perip_conn 20;

    location /api/books {
        # Upload endpoint gets its own, much stricter, zone — S9.5's
        # quota/TTL is the durable enforcement; this is the first, cheap
        # line of defence against a scripted flood before it ever reaches
        # Postgres or the pipeline.
        limit_req zone=uploads burst=2 nodelay;
        limit_req zone=perip burst=20 nodelay;
        proxy_pass         http://web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location ~ ^/api/books/[^/]+/pages/ {
        # Page renders are immutable once a book finishes ingesting — an
        # edge cache here is the honest, buildable stand-in for "a CDN in
        # front of page renders" (devops-1.md S9.4) without provisioning an
        # actual CDN account.
        proxy_pass          http://web:80;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_cache         pages;
        proxy_cache_valid   200 24h;
        proxy_cache_key     $scheme$host$request_uri;
        add_header          X-Edge-Cache $upstream_cache_status;
    }

    location / {
        limit_req zone=perip burst=20 nodelay;
        proxy_pass          http://web:80;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;

        # SSE streaming (/api/query) must not be buffered — same reasoning
        # as web/nginx.conf's own /api/ block, repeated here because this
        # location proxies straight through it rather than re-entering it.
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
    }
}
