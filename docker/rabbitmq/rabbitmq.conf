# RabbitMQ 4 turns transient non-exclusive queues off by default. Celery's
# pidbox and reply queues are exactly that (durable=false, exclusive=false), so
# without this permit every `Queue.declare` fails with
#   INTERNAL_ERROR - Feature `transient_nonexcl_queues` is deprecated
# and the worker crashloops with RestartFreqExceeded within a second of boot.
# Celery has no setting that changes how it declares those queues, so the fix
# has to live on the broker.
deprecated_features.permit.transient_nonexcl_queues = true

# Kombu still sets a channel-global basic.qos on some transports.
deprecated_features.permit.global_qos = true
